[project]
name = "terra-dok-leads"
version = "1.0.0"
description = "Industrial lead generation tool for TERRA DOK premium wooden windows"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.1",
    "polars==1.42.1",
    "aiosqlite>=0.22.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "python-dotenv==1.2.2",
    "tenacity>=8.2.0",
    "scrapy==2.16.0",
    "selenium==4.45.0",
    "undetected-chromedriver==3.5.5",
    "curl-cffi==0.15.0",
    "python-json-logger==4.0.0",
    "playwright-stealth==2.0.3",
    "scrapy-curl-cffi==0.2.0",
    "scrapy-playwright==0.0.48",
    "pychrome==0.2.4",
    "psutil>=5.4.8",
    "xlsxwriter>=3.0.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[project.scripts]
terra-dok = "src.cli.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["src/vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["ARG001"]
"src/discovery/catalogs.py" = ["ARG002"]
"src/discovery/geo_services.py" = ["ARG002"]
"src/enrichment/engine.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "src.vendor.*"
ignore_errors = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["src.companies_website.run_scraper", "src.cli.run_scraper_cmd"]
disable_error_code = ["attr-defined"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.vendor*"]

