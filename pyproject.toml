[project]
name = "terra-dok-leads"
version = "1.0.0"
description = "Industrial lead generation tool for TERRA DOK premium wooden windows"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.1",
    "polars==1.42.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tenacity==9.1.4",
    "scrapy==2.16.0",
    "selenium==4.45.0",
    "undetected-chromedriver==3.5.5",
    "curl-cffi==0.15.0",
    "playwright-stealth==2.0.3",
    "scrapy-curl-cffi==0.2.0",
    "scrapy-playwright==0.0.48",
    "pychrome==0.2.4",
    "psutil==7.2.2",
    "xlsxwriter==3.2.9",
    "pydantic-settings==2.14.2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.20",
    "mypy==2.1.0",
]

[project.scripts]
terra-dok = "src.cli.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "src.vendor.*"
ignore_errors = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["src.cli.run_scraper_cmd"]
disable_error_code = ["attr-defined"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.vendor*"]
